<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PS5 PKG Sender</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b0d10;color:#f2f4f7}
    *{box-sizing:border-box} body{margin:0;background:#0b0d10} button,input{font:inherit}
    .shell{max-width:1180px;margin:0 auto;padding:36px 22px 64px}
    .topbar{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;margin-bottom:28px}
    .eyebrow{color:#7f8b99;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:7px}
    h1{font-size:clamp(26px,4vw,38px);line-height:1.08;margin:0 0 8px}.subtitle{color:#a8b1bd;font-size:14px;margin:0}
    .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
    .button{border:1px solid #2c333d;color:#eef2f6;background:#161a20;padding:10px 15px;border-radius:9px;cursor:pointer}
    .button:hover{border-color:#596676;background:#1c222a}.button:disabled{opacity:.45;cursor:not-allowed}
    .button.primary{background:#e8edf3;color:#0c1014;border-color:#e8edf3;font-weight:700}.button.primary:hover{background:#fff;border-color:#fff}
    .statusline{min-height:42px;padding:11px 14px;border:1px solid #252b33;border-radius:10px;background:#11151a;color:#aeb8c4;margin-bottom:18px;font-size:13px;display:flex;align-items:center;gap:9px}
    .statusdot{width:8px;height:8px;border-radius:50%;background:#5f6a76;flex:0 0 auto}.statusdot.ok{background:#63d297}.statusdot.error{background:#ff6b75}
    .toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}.count{color:#7f8b99;font-size:13px}
    .search{width:min(360px,60vw);border:1px solid #252b33;background:#11151a;color:#f2f4f7;border-radius:9px;padding:10px 12px;outline:none}.search:focus{border-color:#596676}
    .grid{display:grid;gap:16px}.family-card{border:1px solid #222933;background:#101419;border-radius:13px;overflow:hidden}.family-head{padding:18px;background:#12171d;border-bottom:1px solid #222933;display:grid;grid-template-columns:88px minmax(0,1fr);gap:16px;align-items:center}.cover{width:88px;height:88px;border-radius:11px;border:1px solid #2a323c;background:#181e25;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#606c79;font-size:11px;font-weight:750;letter-spacing:.08em}.cover img{width:100%;height:100%;object-fit:cover;display:block}.family-title{font-size:19px;font-weight:760;line-height:1.3;margin-bottom:7px;overflow-wrap:anywhere}.package-list{display:grid}.package-row{padding:15px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;border-top:1px solid #1e252d}.package-row:first-child{border-top:0}.package-top{display:flex;gap:9px;align-items:center;margin-bottom:7px}.package-name{font-size:14px;font-weight:650;overflow-wrap:anywhere}.name{font-size:15px;font-weight:720;line-height:1.35;overflow-wrap:anywhere;margin-bottom:5px}.path{color:#7f8b99;font-size:12px;line-height:1.45;overflow-wrap:anywhere;margin-bottom:11px}.path.compact{margin:7px 0 0}
    .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:#9aa5b1;font-size:12px}.chip{border:1px solid #303844;background:#171c22;border-radius:999px;padding:3px 8px;color:#c4ccd6}.muted{color:#697481}.progress-wrap{margin-top:14px;display:none}.progress-wrap.visible{display:block}
    .progress-head{display:flex;justify-content:space-between;gap:12px;font-size:12px;margin-bottom:7px}.progress-label{color:#c6ced8;font-weight:650}.progress-bytes{color:#7f8b99;font-variant-numeric:tabular-nums}
    .track{height:6px;border-radius:999px;background:#242b34;overflow:hidden}.fill{height:100%;width:0;background:#73a7ff;transition:width .25s ease}.fill.complete{background:#63d297}.fill.error{background:#ff6b75}
    .empty{border:1px dashed #2a313a;border-radius:12px;padding:34px 20px;text-align:center;color:#7f8b99}
    .toast{position:fixed;right:20px;bottom:20px;max-width:min(420px,calc(100vw - 40px));background:#171c23;color:#eef2f6;border:1px solid #303845;border-radius:10px;padding:12px 14px;box-shadow:0 14px 44px rgba(0,0,0,.35);opacity:0;pointer-events:none;transform:translateY(8px);transition:.18s ease;font-size:13px}
    .toast.visible{opacity:1;transform:translateY(0)}.toast.error{border-color:#63343a}
    @media(max-width:700px){.shell{padding:24px 14px 48px}.topbar{flex-direction:column}.actions{justify-content:flex-start}.toolbar{align-items:stretch;flex-direction:column-reverse}.search{width:100%}.family-head{grid-template-columns:68px minmax(0,1fr);gap:12px}.cover{width:68px;height:68px}.package-row{grid-template-columns:1fr}.package-row>.button{width:100%}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div><div class="eyebrow">Synology · PS5</div><h1>PKG Sender</h1><p class="subtitle">Install packages from the NAS and monitor HTTP transfer progress.</p></div>
      <div class="actions"><button id="rescanButton" class="button">Rescan library</button><button id="refreshButton" class="button">Refresh</button></div>
    </header>
    <div id="statusLine" class="statusline"><span id="statusDot" class="statusdot"></span><span id="statusText">Connecting…</span></div>
    <div class="toolbar"><div id="packageCount" class="count">0 packages</div><input id="searchInput" class="search" type="search" autocomplete="off" placeholder="Filter packages…"></div>
    <section id="packageGrid" class="grid" aria-live="polite"></section>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script>
    const state={families:[],transfers:new Map(),discovery:null,installing:new Set(),query:""};
    const els={grid:document.getElementById("packageGrid"),count:document.getElementById("packageCount"),search:document.getElementById("searchInput"),rescan:document.getElementById("rescanButton"),refresh:document.getElementById("refreshButton"),statusDot:document.getElementById("statusDot"),statusText:document.getElementById("statusText"),toast:document.getElementById("toast")};
    function formatBytes(bytes){if(!Number.isFinite(bytes)||bytes<0)return"—";const units=["B","KiB","MiB","GiB","TiB"];let value=bytes,unit=0;while(value>=1024&&unit<units.length-1){value/=1024;unit++}const digits=value>=100||unit===0?0:value>=10?1:2;return value.toFixed(digits)+" "+units[unit]}
    function statusLabel(status){return({requesting:"Contacting PS5",queued:"Queued",downloading:"Transferring",complete:"Transfer complete",error:"Error"})[status]||"Ready"}
    function packageTypeLabel(pkg){const labels={game:"Game",patch:"Patch",dlc:"DLC",app:"App",unknown:"Unknown"};const label=labels[pkg.packageType]||"Unknown";return pkg.packageTypeSource==="heuristic"?"Likely "+label:label}
    function setConnection(ok,message){els.statusDot.className="statusdot "+(ok?"ok":"error");els.statusText.textContent=message}
    function discoveryStatus(snapshot){
      if(!snapshot)return"NAS online";
      const target=snapshot.configuredIp||"not configured";
      const consoles=Array.isArray(snapshot.consoles)?snapshot.consoles:[];
      const configured=consoles.find(console=>console.configured);
      if(configured&&configured.online)return"NAS online · PS5 "+target+" · beacon online";
      const online=consoles.filter(console=>console.online);
      if(online.length)return"NAS online · configured PS5 "+target+" · "+online.length+" other receiver"+(online.length===1?"":"s")+" discovered";
      if(snapshot.listening)return"NAS online · configured PS5 "+target+" · waiting for UDP beacon";
      return"NAS online · configured PS5 "+target+" · discovery unavailable";
    }
    let toastTimer;function showToast(message,error=false){clearTimeout(toastTimer);els.toast.textContent=message;els.toast.className="toast visible"+(error?" error":"");toastTimer=setTimeout(()=>els.toast.className="toast",3600)}
    async function fetchJSON(url,options={}){const response=await fetch(url,{cache:"no-store",...options});let body=null;try{body=await response.json()}catch{}if(!response.ok){throw new Error((body&&(body.error||body.message))||response.status+" "+response.statusText)}return body}
    function packageSearchText(pkg){return[pkg.title,pkg.name,pkg.relativePath,pkg.titleId,pkg.contentId,pkg.version,pkg.packageType].filter(Boolean).join("\n").toLocaleLowerCase()}
    function filteredFamilies(){
      const query=state.query.trim().toLocaleLowerCase();
      if(!query)return state.families.map(family=>({...family,visiblePackages:family.packages||[]}));
      const out=[];
      for(const family of state.families){
        const familyMatch=[family.title,family.titleId].filter(Boolean).join("\n").toLocaleLowerCase().includes(query);
        const visiblePackages=(family.packages||[]).filter(pkg=>familyMatch||packageSearchText(pkg).includes(query));
        if(visiblePackages.length)out.push({...family,visiblePackages});
      }
      return out;
    }
    function renderProgress(pkg,transfer){
      const progress=document.createElement("div");progress.className="progress-wrap"+(transfer?" visible":"");
      if(!transfer)return progress;
      const head=document.createElement("div");head.className="progress-head";
      const label=document.createElement("span");label.className="progress-label";
      const percent=Math.max(0,Math.min(100,Number(transfer.percent)||0));label.textContent=statusLabel(transfer.status)+" · "+percent.toFixed(percent===100?0:1)+"%";
      const bytes=document.createElement("span");bytes.className="progress-bytes";bytes.textContent=formatBytes(transfer.transferred)+" / "+formatBytes(transfer.total);head.append(label,bytes);
      const track=document.createElement("div");track.className="track";const fill=document.createElement("div");fill.className="fill"+(transfer.status==="complete"?" complete":transfer.status==="error"?" error":"");fill.style.width=percent+"%";track.appendChild(fill);progress.append(head,track);
      if(transfer.error){const error=document.createElement("div");error.className="path";error.style.marginTop="8px";error.textContent=transfer.error;progress.appendChild(error)}
      return progress;
    }
    function renderPackage(pkg){
      const transfer=state.transfers.get(pkg.id),row=document.createElement("div");row.className="package-row";
      const content=document.createElement("div");
      const top=document.createElement("div");top.className="package-top";
      const type=document.createElement("span");type.className="chip";type.textContent=packageTypeLabel(pkg);type.title="Classification source: "+(pkg.packageTypeSource||"none");
      const packageTitle=document.createElement("span");packageTitle.className="package-name";packageTitle.textContent=pkg.title||pkg.name;
      top.append(type,packageTitle);content.appendChild(top);
      const meta=document.createElement("div");meta.className="meta";
      const size=document.createElement("span");size.textContent=formatBytes(pkg.size);meta.appendChild(size);
      if(pkg.version){const value=document.createElement("span");value.textContent="v"+pkg.version;meta.appendChild(value)}
      if(pkg.contentId){const value=document.createElement("span");value.className="muted";value.textContent=pkg.contentId;meta.appendChild(value)}
      if(!pkg.metadataParsed){const value=document.createElement("span");value.className="muted";value.textContent="Metadata unavailable";meta.appendChild(value)}
      const stateText=document.createElement("span");stateText.textContent=statusLabel(transfer&&transfer.status);meta.appendChild(stateText);content.appendChild(meta);
      const path=document.createElement("div");path.className="path compact";path.textContent=pkg.title&&pkg.title!==pkg.name?(pkg.name+" · "+pkg.relativePath):pkg.relativePath;content.appendChild(path);
      content.appendChild(renderProgress(pkg,transfer));
      const button=document.createElement("button");button.className="button primary";
      button.textContent=state.installing.has(pkg.id)?"Queuing…":"Install";
      button.disabled=state.installing.has(pkg.id)||(transfer&&["requesting","queued","downloading"].includes(transfer.status));
      button.addEventListener("click",()=>installPackage(pkg));
      row.append(content,button);return row;
    }
    function renderCover(family){
      const cover=document.createElement("div");cover.className="cover";cover.textContent="PS5";
      const source=(family.packages||[]).find(pkg=>pkg.packageType==="game");
      if(!source)return cover;
      const img=document.createElement("img");img.alt="";img.loading="lazy";img.src="/icon/"+encodeURIComponent(source.id);
      cover.textContent="";cover.appendChild(img);
      img.addEventListener("error",()=>{img.remove();cover.textContent="PS5"},{once:true});
      return cover;
    }
    function render(){
      const families=filteredFamilies();
      const packageCount=state.families.reduce((sum,family)=>sum+(family.packageCount||0),0);
      els.count.textContent=state.families.length+(state.families.length===1?" title":" titles")+" · "+packageCount+(packageCount===1?" package":" packages");
      els.grid.replaceChildren();
      if(!families.length){const empty=document.createElement("div");empty.className="empty";empty.textContent=state.families.length?"No titles or packages match the filter.":"No PKG files found. Rescan the library after adding files.";els.grid.appendChild(empty);return}
      for(const family of families){
        const card=document.createElement("article");card.className="family-card";
        const head=document.createElement("div");head.className="family-head";
        const identity=document.createElement("div");
        const title=document.createElement("div");title.className="family-title";title.textContent=family.title||family.titleId||family.id;
        const meta=document.createElement("div");meta.className="meta";
        if(family.titleId){const tid=document.createElement("span");tid.className="chip";tid.textContent=family.titleId;meta.appendChild(tid)}
        const packageCount=document.createElement("span");packageCount.textContent=family.packageCount+(family.packageCount===1?" package":" packages");
        const size=document.createElement("span");size.textContent=formatBytes(family.totalSize);meta.append(packageCount,size);identity.append(title,meta);head.append(renderCover(family),identity);card.appendChild(head);
        const list=document.createElement("div");list.className="package-list";
        for(const pkg of family.visiblePackages)list.appendChild(renderPackage(pkg));
        card.appendChild(list);els.grid.appendChild(card);
      }
    }
    async function refresh({quiet=false}={}){try{const[families,transfers,discovery]=await Promise.all([fetchJSON("/api/families"),fetchJSON("/api/transfers"),fetchJSON("/api/discovery")]);state.families=Array.isArray(families)?families:[];state.transfers=new Map((Array.isArray(transfers)?transfers:[]).map(t=>[t.id,t]));state.discovery=discovery||null;setConnection(true,discoveryStatus(state.discovery));render()}catch(error){setConnection(false,"Connection error · "+error.message);if(!quiet)showToast("Refresh failed: "+error.message,true)}}
    async function installPackage(pkg){const display=pkg.title&&pkg.title!==pkg.name?pkg.title+"\n"+pkg.name:pkg.name;if(!window.confirm("Install this PKG on the configured PS5?\n\n"+display+"\n"+formatBytes(pkg.size)))return;state.installing.add(pkg.id);render();try{await fetchJSON("/api/install/"+encodeURIComponent(pkg.id),{method:"POST"});showToast("Install queued: "+(pkg.title||pkg.name));await refresh({quiet:true})}catch(error){showToast("Install failed: "+error.message,true)}finally{state.installing.delete(pkg.id);render()}}
    async function rescan(){els.rescan.disabled=true;try{const result=await fetchJSON("/api/rescan",{method:"POST"});showToast("Library rescanned · "+result.packages+" PKG file(s)");await refresh({quiet:true})}catch(error){showToast("Rescan failed: "+error.message,true)}finally{els.rescan.disabled=false}}
    els.search.addEventListener("input",event=>{state.query=event.target.value;render()});els.rescan.addEventListener("click",rescan);els.refresh.addEventListener("click",()=>refresh());
    refresh();setInterval(()=>refresh({quiet:true}),1000);
  </script>
</body>
</html>
